    <script>
      const eyeBox = document.querySelector(".eye-box");
      const people11 = document.querySelector(".people-11");

      document.addEventListener("mousemove", function (e) {
        const rect = eyeBox.getBoundingClientRect();

        const centerX = rect.left + rect.width / 2;
        const centerY = rect.top + rect.height / 2;

        const dx = e.clientX - centerX;
        const dy = e.clientY - centerY;

        const angle = Math.atan2(dy, dx);

        const radius = 40;

        const x = Math.cos(angle) * radius;
        const y = Math.sin(angle) * radius;

        people11.style.left = "50%";
        people11.style.top = "50%";
        people11.style.transform = `translate(calc(-50% + ${x}px), calc(-50% + ${y}px)) scaleY(1.5)`;
      });
    </script>

      window.addEventListener("wheel", function (e) {

    <script>
      function swapOn() {
        document.body.classList.add("swap-colors");
      }

      function swapOff() {
        document.body.classList.remove("swap-colors");
      }

      // 电脑
      window.addEventListener("wheel", function (e) {
        if (e.deltaY < 0) {
          swapOn();
        }

        if (e.deltaY > 0) {
          swapOff();
        }
      });

      // 手机
      let startY = 0;

      window.addEventListener("touchstart", function (e) {
        startY = e.touches[0].clientY;
      });

      window.addEventListener("touchend", function (e) {
        const endY = e.changedTouches[0].clientY;

        if (endY < startY) {
          swapOn();
        }

        if (endY > startY) {
          swapOff();
        }
      });
    </script>
  </body>
